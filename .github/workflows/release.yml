name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Release for Tag: ${TAG} (Version: ${VERSION})"

      - name: Select Xcode & Swift Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run Full Test Suite
        run: swift test

      - name: Build & Assemble .app Bundle
        run: make bundle

      - name: Package Distributable ZIP & Generate SHA256 Checksum
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="WakeUpNeo-${VERSION}-macOS.zip"
          SHA_NAME="WakeUpNeo-${VERSION}-macOS.zip.sha256"
          
          cd build
          # Archive the .app preserving symlinks, metadata, and permissions
          zip -r -y "${ZIP_NAME}" WakeUpNeo.app
          shasum -a 256 "${ZIP_NAME}" > "${SHA_NAME}"
          
          echo "ZIP created: ${ZIP_NAME}"
          cat "${SHA_NAME}"
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WakeUpNeo ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/WakeUpNeo-${{ steps.version.outputs.version }}-macOS.zip
            build/WakeUpNeo-${{ steps.version.outputs.version }}-macOS.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Cask in Tap
        if: success()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA=$(awk '{print $1}' "build/WakeUpNeo-${VERSION}-macOS.zip.sha256")
          
          echo "Updating Homebrew Cask to v${VERSION} (SHA256: ${SHA})..."
          
          git clone "https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN || secrets.TAP_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}@github.com/uysalserkan/homebrew-tap.git" tap_repo || {
            echo "::warning::Could not clone homebrew-tap. Set HOMEBREW_TAP_TOKEN secret for automated cross-repo updates."
            exit 0
          }
          
          mkdir -p tap_repo/Casks
          CASK_FILE="tap_repo/Casks/wakeupneo.rb"
          
          printf 'cask "wakeupneo" do\n  version "%s"\n  sha256 "%s"\n\n  url "https://github.com/uysalserkan/WakeUpNeo/releases/download/v#{version}/WakeUpNeo-#{version}-macOS.zip"\n  name "WakeUpNeo"\n  desc "Native macOS menu bar utility to prevent sleep during critical tasks"\n  homepage "https://github.com/uysalserkan/WakeUpNeo"\n\n  depends_on macos: :sequoia\n\n  app "WakeUpNeo.app"\n\n  zap trash: [\n    "~/Library/Application Support/com.wakeupneo.app",\n    "~/Library/Caches/com.wakeupneo.app",\n    "~/Library/Preferences/com.wakeupneo.app.plist",\n  ]\nend\n' "${VERSION}" "${SHA}" > "${CASK_FILE}"
          
          cd tap_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/wakeupneo.rb
          
          if git diff --staged --quiet; then
            echo "Homebrew Cask is already up to date for v${VERSION}."
          else
            git commit -m "Update wakeupneo cask to v${VERSION}"
            git push origin main || echo "::warning::Failed to push Cask update. Please ensure HOMEBREW_TAP_TOKEN secret is configured."
            echo "Successfully updated Homebrew Cask in uysalserkan/homebrew-tap to v${VERSION}!"
          fi

